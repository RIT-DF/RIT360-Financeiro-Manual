<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(50, 20)">
    <rect width="320" height="48" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="48" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="29" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">1</text>
    <text x="44" y="29" fill="#0f172a" font-weight="600" font-size="13">Selecionar o Período Fiscal</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 210,68 L 210,85" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Step 2 -->
  <g transform="translate(50, 90)">
    <rect width="320" height="48" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="48" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="29" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">2</text>
    <text x="44" y="29" fill="#0f172a" font-weight="600" font-size="13">Avaliar o Semáforo dos 3 Pilares</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 210,138 L 210,155" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Step 3 -->
  <g transform="translate(50, 160)">
    <rect width="320" height="48" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="48" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="29" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">3</text>
    <text x="44" y="29" fill="#0f172a" font-weight="600" font-size="13">Conferir Comprovantes e Emitir Atestes</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 210,208 L 210,225" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Step 4 -->
  <g transform="translate(50, 230)">
    <rect width="320" height="48" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="48" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="29" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">4</text>
    <text x="44" y="29" fill="#0f172a" font-weight="600" font-size="13">Verificar Conciliação de Extratos (OFX)</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <path d="M 210,278 L 210,295" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Step 5 -->
  <g transform="translate(50, 300)">
    <rect width="320" height="48" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="48" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="29" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">5</text>
    <text x="44" y="29" fill="#0f172a" font-weight="600" font-size="13">Validar Finalidade Estatutária e Projetos</text>
  </g>

  <!-- Arrow 5 to 6 -->
  <path d="M 210,348 L 210,365" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Step 6 -->
  <g transform="translate(50, 370)">
    <rect width="320" height="48" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="48" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="29" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">6</text>
    <text x="44" y="29" fill="#0f172a" font-weight="600" font-size="13">Examinar Demonstrativos Contábeis</text>
  </g>

  <!-- Arrow 6 to Decision -->
  <path d="M 210,418 L 210,445" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Decision Diamond -->
  <g transform="translate(210, 480)">
    <polygon points="0,-32 90,0 0,32 -90,0" fill="#f8fafc" stroke="#0f766e" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="-5" fill="#0f172a" font-weight="600" font-size="12" text-anchor="middle">Há dúvidas ou</text>
    <text x="0" y="11" fill="#0f172a" font-weight="600" font-size="12" text-anchor="middle">inconsistências?</text>
  </g>

  <!-- Branch: SIM (to Diligences) -->
  <path d="M 300,480 L 440,480" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" fill="none" />
  <rect x="330" y="465" width="46" height="20" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" />
  <text x="353" y="479" fill="#92400e" font-weight="700" font-size="11" text-anchor="middle">Sim</text>

  <!-- Step 7 (Diligence Flow) -->
  <g transform="translate(445, 435)">
    <rect width="305" height="90" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="32" height="90" rx="8" fill="url(#alertGrad)" />
    <text x="16" y="50" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">7</text>
    <text x="42" y="30" fill="#92400e" font-weight="700" font-size="13">Rito de Diligência Formal</text>
    <text x="42" y="50" fill="#78350f" font-size="12">• Tesouraria responde e anexa comprovantes</text>
    <text x="42" y="68" fill="#78350f" font-size="12">• Comissão julga: Esclarecida ou Ressalva</text>
  </g>

  <!-- Diligence back to Step 8 -->
  <path d="M 597,525 L 597,565 L 380,565" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" fill="none" />

  <!-- Branch: NAO (Direct to Step 8) -->
  <path d="M 210,512 L 210,542" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <rect x="218" y="518" width="46" height="20" rx="4" fill="#ccfbf1" stroke="#5eead4" stroke-width="1" />
  <text x="241" y="532" fill="#0f766e" font-weight="700" font-size="11" text-anchor="middle">Não</text>

  <!-- Step 8 -->
  <g transform="translate(50, 545)">
    <rect width="320" height="52" rx="8" fill="url(#boxGrad)" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
    <rect width="32" height="52" rx="8" fill="url(#primaryGrad)" />
    <text x="16" y="32" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">8</text>
    <text x="44" y="24" fill="#0f172a" font-weight="700" font-size="13">Registrar Voto e Emitir Parecer</text>
    <text x="44" y="42" fill="#475569" font-size="11">Exportar Caderno em PDF e Planilha XLSX</text>
  </g>
</svg>
