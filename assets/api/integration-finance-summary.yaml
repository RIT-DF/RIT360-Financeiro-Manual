openapi: 3.1.0
info:
  title: RIT360 Financeiro — API de resumo financeiro
  version: "1.0.0"
  description: |
    Leitura de indicadores financeiros AGREGADOS de uma organização, para
    consumo por sistemas parceiros.

    Regras da camada:
      - Somente leitura. Não existe escrita por esta API.
      - Cada credencial enxerga exclusivamente a organização que a gerou.
      - Nenhum lançamento individual, pessoa, dado bancário, fornecedor ou
        anexo é exposto — apenas totais.
      - A credencial é exibida uma única vez na criação; o sistema guarda
        apenas o hash. Perdeu, revogue e gere outra.
      - Revogação vale a partir da chamada seguinte e é definitiva.
servers:
  - url: https://jswyzxutdkrbrleotklo.supabase.co/functions/v1
    description: |
      Servidor de funções do RIT360 Financeiro. Endereço único para todas as
      organizações, pois a plataforma é um serviço compartilhado.
security:
  - integrationToken: []
paths:
  /integration_finance_summary:
    get:
      summary: Resumo financeiro do período
      operationId: getFinanceSummary
      parameters:
        - name: from
          in: query
          required: true
          description: Início do período (AAAA-MM-DD), pela data efetiva de apuração.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Fim do período (AAAA-MM-DD), igual ou posterior a `from`.
          schema: { type: string, format: date }
        - name: group_by
          in: query
          required: false
          description: Quebra adicional. Ausente devolve apenas os totais.
          schema: { type: string, enum: [category, project] }
      responses:
        "200":
          description: Resumo agregado.
          headers:
            X-RateLimit-Limit:
              schema: { type: integer }
            X-RateLimit-Remaining:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSummary" }
        "401":
          description: Credencial ausente, inválida ou revogada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Credencial sem o escopo `finance.summary.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Período ou agrupamento inválido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Limite por hora atingido. Apenas requisições ATENDIDAS contam para
            o limite; as recusadas ficam registradas mas não realimentam o bloqueio.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            Falha ao apurar. Nunca devolvemos zero no lugar de erro: ausência de
            dado e falha de apuração são respostas diferentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    integrationToken:
      type: http
      scheme: bearer
      description: "Credencial gerada em Configurações › Integrações. Formato `rit_<prefixo>_<segredo>`."
  schemas:
    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          enum: [unauthorized, invalid_credential, revoked_credential, insufficient_scope,
                 validation_error, rate_limited, method_not_allowed, internal]
        message: { type: string }
        retry_after_seconds: { type: integer, nullable: true }
    BudgetYear:
      type: object
      required: [fiscal_year, available]
      properties:
        fiscal_year: { type: integer }
        available:
          type: boolean
          description: |
            Falso quando não há orçamento no exercício ou quando a versão
            vigente não está aprovada. O orçado NUNCA sai de rascunho.
        reason:
          type: string
          enum: [sem_orcamento_no_exercicio, sem_versao_vigente_aprovada, indisponivel]
        version_number: { type: integer, nullable: true }
        previsto_receita: { type: number }
        previsto_despesa: { type: number }
    BreakdownRow:
      type: object
      required: [id, name, receitas, despesas]
      properties:
        id:
          type: string
          description: Identificador do grupo, ou `sem_categoria`/`sem_projeto`.
        name: { type: string }
        receitas: { type: number }
        despesas: { type: number }
    FinanceSummary:
      type: object
      required: [organization_id, period, currency, balance, realized, budget, group_by, breakdown]
      properties:
        organization_id: { type: string, format: uuid }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        currency: { type: string, enum: [BRL] }
        balance:
          type: object
          description: Saldo das contas — apenas realizado, sem valores previstos.
          required: [total]
          properties:
            total: { type: number }
        realized:
          type: object
          description: Movimentação realizada no período.
          required: [receitas, despesas, resultado]
          properties:
            receitas: { type: number }
            despesas: { type: number }
            resultado: { type: number }
        budget:
          type: array
          description: Um item por exercício coberto pelo período.
          items: { $ref: "#/components/schemas/BudgetYear" }
        group_by:
          type: string
          nullable: true
          enum: [category, project, null]
        breakdown:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BreakdownRow" }
